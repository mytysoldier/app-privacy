<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サポート | 1min Voice Journal</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ef;
        --text: #1b1b1b;
        --muted: #555;
        --card: #ffffff;
        --accent: #0ea5e9;
      }
      body {
        margin: 0;
        font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
        background: linear-gradient(180deg, #eef8ff 0%, var(--bg) 40%, #f2efe9 100%);
        color: var(--text);
      }
      main {
        max-width: 820px;
        margin: 0 auto;
        padding: 56px 20px 72px;
      }
      h1 {
        font-size: 32px;
        margin: 0 0 12px;
      }
      p, li {
        line-height: 1.7;
      }
      .card {
        background: var(--card);
        border-radius: 16px;
        padding: 24px 28px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }
      .note {
        color: var(--muted);
        font-size: 14px;
      }
      a {
        color: var(--accent);
      }
      @media (max-width: 600px) {
        main {
          padding: 40px 16px 56px;
        }
        h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>サポート</h1>
      <p class="note">1min Voice Journal</p>
      <div class="card">
        <p>いつもご利用ありがとうございます。以下よりお問い合わせください。</p>
        <p>
          <a href="https://forms.gle/C8tQpagQvUb8Fcho6">Googleフォームはこちら</a>
        </p>
        <p class="note">不具合報告の際は、再現手順・端末情報・OSバージョンを記載いただけると助かります。</p>
      </div>
    </main>
  </body>
</html>
